name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    name: 代码质量门禁
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 按锁文件同步依赖
        run: uv sync --locked

      - name: Ruff 代码检查
        run: uv run ruff check .

      - name: Ruff 格式检查
        run: uv run ruff format --check .

      - name: Mypy 类型检查
        run: uv run mypy src

      - name: 单元测试
        run: uv run pytest tests/unit
