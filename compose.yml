name: evidence-desk-agent

services:
  postgres:
    # 换成带 pgvector 扩展的镜像（阶段 5 长期记忆持久化 PostgresStore 需要它做
    # 语义检索）。同样是 Postgres 17，数据目录格式兼容，换镜像不会丢现有数据。
    image: pgvector/pgvector:pg17
    container_name: evidence-desk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.3
    container_name: evidence-desk-weaviate
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEAVIATE_HTTP_PORT:-8081}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT:-50052}:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: evidence-desk-node1
      # P6-03：BM25/Hybrid 检索要用中文分词器，核心自带但默认关闭，得显式开启。
      ENABLE_TOKENIZER_GSE_CH: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/v1/.well-known/ready || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres_data:
    name: evidence-desk-postgres-data
  weaviate_data:
    name: evidence-desk-weaviate-data
